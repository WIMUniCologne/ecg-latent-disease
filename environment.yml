# Conda environment for ecg-latent-disease, pinned to the versions the results were
# computed with (Python 3.12.4, Linux x86_64, NVIDIA RTX 4090, driver 555.42.02).
#
#   conda env create -f environment.yml
#   conda activate ecg-latent
#
# PyTorch comes from the CUDA 12.4 wheel index, which runs on drivers that support
# CUDA 12.4 or newer. For a CPU-only machine, replace the index URL with
# https://download.pytorch.org/whl/cpu.
name: ecg-latent
channels:
  - conda-forge
dependencies:
  - python=3.12.4
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - wfdb==4.3.1
      - biosppy==2.2.4
      - peakutils==1.3.5
      - numpy==2.1.2
      - scipy==1.14.1
      - pandas==2.3.3
      - scikit-learn==1.5.2
      - statsmodels==0.14.6
      - joblib==1.4.2
      - h5py==3.16.0
      - matplotlib==3.11.0
      - pytest==9.1.1
      - neurokit2==0.2.13
      - pyreadr==0.5.7
